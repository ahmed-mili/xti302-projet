# Prison fail2ban pour SSH (exigence J1).
# Lue après defaults-debian.conf : nos valeurs l'emportent.
[sshd]
enabled = true
# Debian 13 n'écrit plus /var/log/auth.log : fail2ban lit le journal systemd
# (c'est pour cela que le paquet python3-systemd est installé).
backend = systemd
# 5 échecs en 10 minutes bannissent l'adresse pendant 10 minutes.
maxretry = 5
findtime = 10m
bantime = 10m
# Le ban passe par nftables (table f2b-table), comme notre pare-feu.
banaction = nftables
# Par défaut, l'action nftables ne crée sa table f2b-table qu'au PREMIER ban.
# actionstart_on_demand=false la crée dès le démarrage de fail2ban : les règles
# de fail2ban sont alors visibles (nft list tables) et testables tout de suite.
# On reprend l'action standard de jail.conf en y ajoutant ce réglage.
action = %(banaction)s[port="%(port)s", protocol="%(protocol)s", actionstart_on_demand=false]
