#!/usr/sbin/nft -f
#
# Pare-feu de la VM Pixelia (exigence J2).
#
# On n'écrit PAS "flush ruleset" : il effacerait toutes les tables, y compris
# f2b-table, celle où fail2ban inscrit les adresses bannies. Un rechargement
# de nftables lèverait alors tous les bans. On remplace seulement NOTRE table
# avec trois instructions :
#   1. "table inet filtre" la crée si elle n'existe pas (sans cela, la
#      suppression qui suit échouerait au tout premier chargement) ;
#   2. "delete table inet filtre" la supprime ;
#   3. "table inet filtre { ... }" la recrée avec les règles ci-dessous.
# Les autres tables ne sont pas touchées.

table inet filtre
delete table inet filtre

table inet filtre {
    # Paquets qui arrivent dans la VM. Tout ce qui n'est pas autorisé
    # ci-dessous est refusé (policy drop).
    chain entree {
        type filter hook input priority filter; policy drop;

        # Le trafic interne de la machine (loopback) est toujours autorisé.
        iif "lo" accept

        # Les paquets invalides sont jetés tout de suite.
        ct state invalid drop

        # Les réponses aux connexions déjà ouvertes par la VM passent.
        ct state established,related accept

        # SSH (port 22) pour administrer la VM.
        tcp dport 22 accept

        # ping (IPv4 et IPv6) : utile pour diagnostiquer le réseau.
        meta l4proto { icmp, ipv6-icmp } accept
    }

    # La VM n'est pas un routeur : elle ne fait suivre aucun paquet.
    chain transfert {
        type filter hook forward priority filter; policy drop;
    }
}
