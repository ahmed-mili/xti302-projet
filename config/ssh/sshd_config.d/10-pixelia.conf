# Durcissement SSH de la VM Pixelia (exigences S1 à S5).
# Debian lit ce dossier avant le reste de sshd_config, et pour chaque réglage
# la première valeur trouvée gagne : ce fichier passe donc avant les valeurs
# par défaut de /etc/ssh/sshd_config, que l'on ne modifie pas.

# S1 : connexion par clé publique seulement, jamais par mot de passe ni par
# questions-réponses au clavier.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# S2 : root ne peut pas se connecter en SSH (les admins passent par sudo).
PermitRootLogin no

# S3 : seuls les membres du groupe acces_ssh peuvent se connecter.
AllowGroups acces_ssh

# S4 : 3 essais d'authentification par connexion.
MaxAuthTries 3

# S4 : fin des sessions inactives. Deux réglages différents :
#   - ChannelTimeout coupe une session SANS TRAFIC pendant 10 minutes (c'est
#     la vraie inactivité de l'utilisateur) ;
#   - ClientAlive détecte une connexion MORTE : sshd envoie un message toutes
#     les 300 s et coupe après 1 message sans réponse, soit 300 x (1 + 1) =
#     600 s (le client répond tout seul : cela ne mesure pas l'inactivité).
ChannelTimeout session=10m
ClientAliveInterval 300
ClientAliveCountMax 1
